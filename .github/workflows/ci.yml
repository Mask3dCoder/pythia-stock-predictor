name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']
      fail-fast: false

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install pip
      run: python -m pip install --upgrade pip

    - name: Install dependencies
      run: |
        pip install pandas numpy yfinance requests beautifulsoup4 lxml statsmodels scikit-learn
        pip install textblob vaderSentiment scipy
        pip install fastapi uvicorn python-dotenv joblib rich pyyaml pydantic pydantic-settings
        pip install pytest pytest-mock pytest-cov ruff

    - name: Run linter
      run: ruff check src/ --select E9,F63,F7,F82 --ignore F401

    - name: Run tests
      env:
        ALPHA_VANTAGE_API_KEY: test_key
        API_KEY: test_api_key
      run: pytest tests/ -v --tb=short
