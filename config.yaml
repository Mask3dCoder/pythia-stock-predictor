# Stock Prediction CLI Configuration

# Data Collection Settings
data:
  # Yahoo Finance settings
  yahoo:
    default_years: 5
    interval: "1d"  # 1m, 2m, 5m, 15m, 30m, 60m, 1h, 1d, 1wk, 1mo
    auto_adjust: true
    back_adjust: false
    repair: false
    keepna: false
    actions: false
    group_by: "ticker"
    threads: true
    progress: true
  
  # Alpha Vantage settings (optional)
  # SECURITY: API key should be set via ALPHA_VANTAGE_API_KEY environment variable
  #           for security. Do not commit API keys to version control.
  alpha_vantage:
    api_key: ""  # Set via ALPHA_VANTAGE_API_KEY environment variable
    base_url: "https://www.alphavantage.co/query"
    
  # Real-time settings
  realtime:
    enabled: false
    update_interval: 60  # seconds
    websocket: false

# Model Settings
models:
  # ARIMA settings
  arima:
    order: [5, 1, 0]  # (p, d, q)
    seasonal_order: [0, 0, 0, 0]
    
  # LSTM settings
  lstm:
    sequence_length: 60
    lstm_units: [50, 50]
    dropout: 0.2
    epochs: 50
    batch_size: 32
    learning_rate: 0.001
    
  # GRU settings
  gru:
    sequence_length: 60
    gru_units: [50, 50]
    dropout: 0.2
    epochs: 50
    batch_size: 32
    learning_rate: 0.001

  # Ensemble settings
  ensemble:
    weights:
      arima: 0.3
      lstm: 0.4
      gru: 0.3

# Technical Indicators
indicators:
  sma_windows: [10, 20, 30, 50, 100, 200]
  ema_windows: [12, 26]
  rsi_period: 14
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  bollinger_period: 20
  bollinger_std: 2
  volume_sma_period: 20

# Sentiment Analysis
sentiment:
  # VADER settings
  vader:
    lexicon_file: "vader_lexicon.txt"
    
  # TextBlob settings
  textblob:
    threshold: 0.0
    
  # News sources
  news:
    enabled: false
    sources:
      - "reuters"
      - "bloomberg"
      - "cnbc"
    keywords: []
    max_articles_per_day: 50

# Preprocessing
preprocessing:
  normalization: "log_returns"  # log_returns, zscore, minmax, none
  train_test_split: 0.8
  validation_split: 0.1
  shuffle: false

# Backtesting
backtest:
  enabled: false
  initial_capital: 100000
  commission: 0.001
  slippage: 0.0005

# API Settings
api:
  host: "0.0.0.0"
  port: 8000
  debug: false

# Dashboard Settings
dashboard:
  theme: "dark"
  refresh_interval: 60
  charts:
    - "candlestick"
    - "sentiment"
    - "prediction"
    - "technical_indicators"

# Logging
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/app.log"
