[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pythia-stock-predictor"
version = "3.0.0"
description = "Intelligent stock prediction system with ML models"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Pythia Team", email = "pythia@example.com"}
]
keywords = ["stock", "prediction", "machine-learning", "finance", "lstm", "arima"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Office/Business :: Financial",
]

dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "yfinance>=0.2.28",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "statsmodels>=0.14.0",
    "scikit-learn>=1.3.0",
    "textblob>=0.17.1",
    "vaderSentiment>=3.3.2",
    "scipy>=1.11.0",
    "fastapi>=0.108.0",
    "uvicorn>=0.25.0",
    "python-dotenv>=1.0.0",
    "joblib>=1.3.0",
    "rich>=13.7.0",
    "pytest>=7.4.0",
    "pytest-mock>=3.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-mock>=3.12.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
]
ml = [
    "tensorflow>=2.15.0",
    "torch>=2.1.0",
    "optuna>=3.5.0",
]
visualization = [
    "plotly>=5.18.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "streamlit>=1.29.0",
]

[project.scripts]
pythia = "src.cli.__main__:main"

[project.urls]
Homepage = "https://github.com/Mask3dCoder/pythia-stock-predictor"
Documentation = "https://github.com/Mask3dCoder/pythia-stock-predictor#readme"
Repository = "https://github.com/Mask3dCoder/pythia-stock-predictor"
Issues = "https://github.com/Mask3dCoder/pythia-stock-predictor/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
